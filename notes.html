<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Ujjwal Mathur</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        * {

        }

        .modal-content {

</head>
<body>
    <!-- Password Protection Screen -->
    <div id="password-screen" class="password-container">
        <h1>Enter Password to Access Notes</h1>
        <input type="password" id="password-input" class="password-input" placeholder="Enter password">
        <button onclick="checkPassword()" class="password-btn">Enter</button>
        <div id="password-error" class="error-message"></div>
    </div>

    <!-- Main App Interface -->
    <div id="app-container" class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Navigation -->
            <div class="sidebar-nav">
                <ul>
                    <li><a href="index.html">🏠 Home</a></li>
                    <li><a href="essays.html">📝 Essays</a></li>
                    <li><a href="books.html">📚 Books</a></li>
                    <li><a href="notes.html" class="active">📋 Notes</a></li>
                </ul>
            </div>
            
            <!-- Notebooks Section -->
            <div class="notebooks-section">
                <div class="notebooks-header">
                    <h3>📚 Notebooks</h3>
                    <button class="new-notebook-btn" onclick="showCreateNotebookModal()">+ New</button>
                </div>
                <div id="notebooks-list" class="notebooks-list">
                    <div class="loading-message">Loading notebooks...</div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <div id="welcome-screen" class="welcome-screen">
                <h2>Hi Ujjwal</h2>
                <p>Write Something. It boosts your creativity!</p>
            </div>
            
            <div id="editor" style="display: none; height: 100%; flex-direction: column;">
                <div class="editor-header">
                    <input type="text" id="note-title" class="note-title-input" placeholder="Untitled Note">
                </div>
                <div class="editor-area">
                    <div class="editor-toolbar">
                        <button class="toolbar-btn" onclick="formatDoc('bold')"><b>B</b></button>
                        <button class="toolbar-btn" onclick="formatDoc('underline')"><u>U</u></button>
                        <button class="toolbar-btn" onclick="formatDoc('strikeThrough')"><s>S</s></button>
                        <select class="toolbar-select" onchange="formatDoc('formatBlock', this.value); this.value='p';">
                            <option value="p" disabled selected>Format</option>
                            <option value="h1">Heading 1</option>
                            <option value="h2">Heading 2</option>
                            <option value="h3">Heading 3</option>
                            <option value="p">Paragraph</option>
                        </select>
                    </div>
                    <div id="note-content" class="note-content-input" contenteditable="true" placeholder="Start writing your note..."></div>
                </div>
                <div class="editor-actions">
                    <span id="save-status" class="save-status"></span>
                </div>
            </div>
        </div>

        <!-- Right Sidebar for Notes (Collapsible) -->
        <div id="notes-sidebar" class="notes-sidebar" style="display: none;">
            <div class="notes-sidebar-header">
                <div class="notes-sidebar-title">
                    <h3 id="current-notebook-name">Select a Notebook</h3>
                    <button class="new-note-btn" onclick="addNoteToCurrentNotebook()">+ New Note</button>
                </div>
                <button class="collapse-btn" onclick="toggleNotesSidebar()" title="Collapse sidebar">‹</button>
            </div>
            <div id="notes-list" class="notes-list">
                <div class="empty-state">Select a notebook to view its notes</div>
            </div>
        </div>

        <!-- Collapsed Notes Sidebar Toggle -->
        <div id="notes-sidebar-collapsed" class="notes-sidebar-collapsed" style="display: none;">
            <button class="expand-btn" onclick="toggleNotesSidebar()" title="Expand notes">›</button>
        </div>
    </div>

    <!-- Create Notebook Modal -->
    <div id="create-notebook-modal" class="modal">
        <div class="modal-content">
            <h3>Create New Notebook</h3>
            <input type="text" id="notebook-name" placeholder="Notebook name...">
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="hideCreateNotebookModal()">Cancel</button>
                <button class="modal-btn primary" onclick="createNotebook()">Create</button>
            </div>
        </div>
    </div>

    <script type="module">
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAxrI1aZr6PiLNjRYoc5zA96yZD7aTuXig",
            authDomain: "personal-website-e638b.firebaseapp.com",
            projectId: "personal-website-e638b",
            storageBucket: "personal-website-e638b.firebasestorage.app",
            messagingSenderId: "338488336517",
            appId: "1:338488336517:web:b9098f10970328c38789ec",
            measurementId: "G-2BPPY29RH7"
        };

        // Import Firebase modules
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query, updateDoc, where } from 'https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js';

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Password
        const CORRECT_PASSWORD = "1906";

        // Global state
        let notebooks = [];
        let notes = [];
        let currentNote = null;
        let currentNotebook = null;

        // Password check
        window.checkPassword = function() {
            const inputPassword = document.getElementById('password-input').value;
            const errorDiv = document.getElementById('password-error');
            
            if (inputPassword === CORRECT_PASSWORD) {
                document.getElementById('password-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'flex';
                loadNotebooks();
            } else {
                errorDiv.textContent = 'Incorrect password. Please try again.';
                document.getElementById('password-input').value = '';
            }
        };

        // Toggle notes sidebar
        window.toggleNotesSidebar = function() {
            const sidebar = document.getElementById('notes-sidebar');
            const collapsed = document.getElementById('notes-sidebar-collapsed');
            
            if (sidebar.style.display === 'none' || sidebar.classList.contains('collapsed')) {
                // Expand
                sidebar.style.display = 'flex';
                sidebar.classList.remove('collapsed');
                collapsed.style.display = 'none';
            } else {
                // Collapse
                sidebar.classList.add('collapsed');
                setTimeout(() => {
                    sidebar.style.display = 'none';
                    collapsed.style.display = 'flex';
                }, 300); // Wait for animation to complete
            }
        };

        // Rich text editor formatting
        window.formatDoc = function(command, value = null) {
            document.execCommand(command, false, value);
            const editor = document.getElementById('note-content');
            editor.focus();
        };

        document.addEventListener('DOMContentLoaded', () => {
            const editor = document.getElementById('note-content');
            const toolbar = document.querySelector('.editor-toolbar');

            const positionToolbar = () => {
                const selection = window.getSelection();
                if (!selection.rangeCount || selection.isCollapsed) {
                    toolbar.style.display = 'none';
                    return;
                }
                
                const range = selection.getRangeAt(0);
                if (!editor.contains(range.commonAncestorContainer)) {
                    toolbar.style.display = 'none';
                    return;
                }
                
                const rect = range.getBoundingClientRect();
                const editorAreaRect = editor.parentElement.getBoundingClientRect();

                toolbar.style.display = 'flex';
                let top = rect.top - editorAreaRect.top - toolbar.offsetHeight - 5;
                let left = rect.left - editorAreaRect.top + (rect.width / 2) - (toolbar.offsetWidth / 2);

                // Boundary checks to keep toolbar within the editor area
                if (top < 0) {
                    top = rect.bottom - editorAreaRect.top + 5;
                }
                if (left < 0) left = 0;
                if (left + toolbar.offsetWidth > editorAreaRect.width) {
                    left = editorAreaRect.width - toolbar.offsetWidth;
                }
                
                toolbar.style.top = `${top}px`;
                toolbar.style.left = `${left}px`;
            };

            document.addEventListener('selectionchange', positionToolbar);
            editor.addEventListener('blur', () => {
                // Delay hiding to allow toolbar clicks
                setTimeout(() => {
                    if (document.activeElement !== editor && !toolbar.contains(document.activeElement)) {
                        toolbar.style.display = 'none';
                    }
                }, 200);
            });
            editor.parentElement.addEventListener('scroll', () => toolbar.style.display = 'none');

            // Autosave logic
            let debounceTimer;
            const noteTitleInput = document.getElementById('note-title');
            const noteContentInput = document.getElementById('note-content');

            const triggerSave = () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    saveCurrentNote();
                }, 1500); // Wait 1.5 seconds after user stops typing
            };
            
            noteTitleInput.addEventListener('input', triggerSave);
            noteContentInput.addEventListener('input', triggerSave);
        });

        // Notebook Management
        window.showCreateNotebookModal = function() {
            document.getElementById('create-notebook-modal').style.display = 'flex';
            document.getElementById('notebook-name').focus();
        };

        window.hideCreateNotebookModal = function() {
            document.getElementById('create-notebook-modal').style.display = 'none';
            document.getElementById('notebook-name').value = '';
        };

        window.createNotebook = async function() {
            const name = document.getElementById('notebook-name').value.trim();
            
            if (!name) {
                alert('Please enter a notebook name.');
                return;
            }

            try {
                console.log('Creating notebook:', name);
                const docRef = await addDoc(collection(db, "notebooks"), {
                    name: name,
                    createdAt: new Date().toISOString()
                });
                console.log('Notebook created with ID:', docRef.id);
                
                hideCreateNotebookModal();
                await loadNotebooks();
            } catch (error) {
                console.error("Error creating notebook: ", error);
                alert('Error creating notebook. Please try again.');
            }
        };

        async function fetchNotesForNotebook(notebookId) {
            const notesList = document.getElementById('notes-list');
            notesList.innerHTML = '<div class="empty-state">Loading notes...</div>';
            
            try {
                const q = query(collection(db, "notes"), where("notebookId", "==", notebookId));
                const querySnapshot = await getDocs(q);
                
                notes = querySnapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                // Manually sort by date after fetching
                notes.sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));

                renderNotesList();
            } catch (error) {
                console.error("Error loading notes: ", error);
                notesList.innerHTML = '<div class="empty-state">Error loading notes.</div>';
            }
        }

        function renderNotesList() {
            const notesList = document.getElementById('notes-list');

            if (!currentNotebook) {
                notesList.innerHTML = '<div class="empty-state">Select a notebook</div>';
                return;
            }

            if (notes.length === 0) {
                notesList.innerHTML = '<div class="empty-state">No notes in this notebook.</div>';
            } else {
                notesList.innerHTML = notes.map(note => {
                    const preview = note.content.replace(/<[^>]+>/g, '').substring(0, 40) + '...';
                    return `
                        <div class="note-item ${currentNote && currentNote.id === note.id ? 'active' : ''}" onclick="selectNote('${note.id}')">
                            <div class="note-content">
                                <div class="note-title">${note.title}</div>
                                <div class="note-preview">${preview}</div>
                            </div>
                            <button class="delete-note-btn" onclick="deleteNote('${note.id}', event)">✕</button>
                        </div>
                    `;
                }).join('');
            }
        }

        window.selectNotebook = async function(notebookId, notebookName) {
            currentNotebook = notebookId;
            currentNote = null;
            
            renderNotebooksList();
            
            document.getElementById('notes-sidebar').style.display = 'flex';
            document.getElementById('current-notebook-name').textContent = notebookName;
            
            showWelcomeScreen();
            
            await fetchNotesForNotebook(notebookId);
        };

        window.addNoteToCurrentNotebook = function() {
            if (!currentNotebook) {
                alert('Please select a notebook first.');
                return;
            }
            
            currentNote = {
                id: null,
                title: '',
                content: '',
                notebookId: currentNotebook,
                isNew: true
            };
            showEditor();
            document.getElementById('note-title').value = '';
            document.getElementById('note-content').innerHTML = '';
            document.getElementById('note-title').focus();
        };

        window.deleteNotebook = async function(notebookId, event) {
            event.stopPropagation();
            
            if (!confirm('Are you sure you want to delete this notebook and all its notes?')) return;
            
            try {
                const notesQuery = query(collection(db, "notes"), where("notebookId", "==", notebookId));
                const notesSnapshot = await getDocs(notesQuery);
                
                const deletePromises = [];
                for (const noteDoc of notesSnapshot.docs) {
                    deletePromises.push(deleteDoc(doc(db, "notes", noteDoc.id)));
                }
                await Promise.all(deletePromises);
                
                await deleteDoc(doc(db, "notebooks", notebookId));
                
                notebooks = notebooks.filter(nb => nb.id !== notebookId);
                
                if (currentNotebook === notebookId) {
                    currentNotebook = null;
                    notes = [];
                    document.getElementById('notes-sidebar').style.display = 'none';
                    showWelcomeScreen();
                }
                
                renderNotebooksList();
            } catch (error) {
                console.error("Error deleting notebook: ", error);
                alert('Error deleting notebook. Please try again.');
            }
        };

        window.selectNote = function(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;
            
            currentNote = { ...note, isNew: false };
            showEditor();
            
            document.getElementById('note-title').value = note.title;
            document.getElementById('note-content').innerHTML = note.content;

            renderNotesList(); // Re-render to show active state
        };

        window.deleteNote = async function(noteId, event) {
            event.stopPropagation();
            if (!confirm('Are you sure you want to delete this note?')) return;

            try {
                const noteToDelete = notes.find(n => n.id === noteId);
                if (!noteToDelete) return;

                await deleteDoc(doc(db, "notes", noteId));

                notes = notes.filter(n => n.id !== noteId);
                
                const notebook = notebooks.find(nb => nb.id === noteToDelete.notebookId);
                if (notebook && notebook.noteCount > 0) {
                    notebook.noteCount--;
                }

                if (currentNote && currentNote.id === noteId) {
                    currentNote = null;
                    showWelcomeScreen();
                }

                renderNotesList();
                renderNotebooksList();
            } catch (error) {
                console.error("Error deleting note:", error);
                alert("Failed to delete note. Please try again.");
            }
        };

        // Save current note
        window.saveCurrentNote = async function() {
            if (!currentNote) return;

            const saveStatus = document.getElementById('save-status');
            saveStatus.textContent = 'Saving...';

            const title = document.getElementById('note-title').value.trim() || 'Untitled Note';
            const content = document.getElementById('note-content').innerHTML;

            currentNote.title = title;
            currentNote.content = content;
            currentNote.updatedAt = new Date().toISOString();

            const noteData = {
                title: title,
                content: content,
                updatedAt: currentNote.updatedAt,
                notebookId: currentNote.notebookId,
            };

            try {
                if (currentNote.isNew) {
                    noteData.createdAt = new Date().toISOString();
                    const docRef = await addDoc(collection(db, "notes"), noteData);
                    
                    currentNote.id = docRef.id;
                    currentNote.isNew = false;
                    
                    notes.unshift({ ...currentNote });

                    const notebook = notebooks.find(nb => nb.id === currentNote.notebookId);
                    if (notebook) notebook.noteCount++;
                } else {
                    const noteRef = doc(db, "notes", currentNote.id);
                    await updateDoc(noteRef, noteData);

                    const noteIndex = notes.findIndex(n => n.id === currentNote.id);
                    if (noteIndex > -1) notes[noteIndex] = { ...currentNote };
                }
                
                notes.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

                renderNotesList();
                renderNotebooksList();
                
                saveStatus.textContent = 'Saved';

            } catch (error) {
                console.error("Error saving note: ", error);
                saveStatus.textContent = 'Error saving.';
            }
        };

        // Show editor
        function showEditor() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('editor').style.display = 'flex';
        }

        // Show welcome screen
        function showWelcomeScreen() {
            document.getElementById('welcome-screen').style.display = 'flex';
            document.getElementById('editor').style.display = 'none';
        }

        // Load notebooks and notes
        async function loadNotebooks() {
            const notebooksList = document.getElementById('notebooks-list');
            notebooksList.innerHTML = '<div class="loading-message">Loading notebooks...</div>';

            try {
                console.log('Loading notebooks...');
                const q = query(collection(db, "notebooks"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                notebooks = await Promise.all(querySnapshot.docs.map(async (doc) => {
                    const notebookData = doc.data();
                    const notesQuery = query(collection(db, "notes"), where("notebookId", "==", doc.id));
                    const notesSnapshot = await getDocs(notesQuery);
                    return {
                        id: doc.id,
                        ...notebookData,
                        noteCount: notesSnapshot.size
                    };
                }));

                console.log('Loaded notebooks:', notebooks);
                renderNotebooksList();
                updateNotesDisplay();
            } catch (error) {
                console.error("Error loading notebooks: ", error);
                notebooksList.innerHTML = '<div class="empty-state">Error loading notebooks.</div>';
            }
        }

        function renderNotebooksList() {
            const notebooksList = document.getElementById('notebooks-list');
            if (notebooks.length === 0) {
                notebooksList.innerHTML = '<div class="empty-state">No notebooks yet. Create one!</div>';
                return;
            }
            
            notebooksList.innerHTML = notebooks.map(notebook => `
                <div class="notebook-item ${currentNotebook === notebook.id ? 'active' : ''}" onclick="selectNotebook('${notebook.id}', '${notebook.name}')">
                    <div class="notebook-content">
                        <div class="notebook-name">${notebook.name}</div>
                        <div class="notebook-count">${notebook.noteCount || 0} notes</div>
                    </div>
                    <div class="notebook-actions">
                        <button class="delete-notebook-btn" onclick="deleteNotebook('${notebook.id}', event)">✕</button>
                    </div>
                </div>
            `).join('');
        }

        // Update notes display in right sidebar
        function updateNotesDisplay(notebookId) {
            const notesList = document.getElementById('notes-list');
            if (!notebookId) {
                notesList.innerHTML = '<div class="empty-state">Select a notebook</div>';
                return;
            }

            const filteredNotes = notes.filter(n => n.notebookId === notebookId);

            if (filteredNotes.length === 0) {
                notesList.innerHTML = '<div class="empty-state">No notes in this notebook.</div>';
            } else {
                notesList.innerHTML = filteredNotes.map(note => {
                    const preview = note.content.replace(/<[^>]+>/g, '').substring(0, 40) + '...';
                    return `
                        <div class="note-item ${currentNote && currentNote.id === note.id ? 'active' : ''}" onclick="selectNote('${note.id}')">
                            <div class="note-content">
                                <div class="note-title">${note.title}</div>
                                <div class="note-preview">${preview}</div>
                            </div>
                            <button class="delete-note-btn" onclick="deleteNote('${note.id}', event)">✕</button>
                        </div>
                    `;
                }).join('');
            }
        }

        // Utility function
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            const passwordInput = document.getElementById('password-input');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        checkPassword();
                    }
                });
                passwordInput.focus();
            }
            
            // Notebook name input enter key
            const notebookNameInput = document.getElementById('notebook-name');
            if (notebookNameInput) {
                notebookNameInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        createNotebook();
                    }
                });
            }
        });
    </script>
</body>
</html>
